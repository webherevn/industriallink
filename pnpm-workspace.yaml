packages:
  - "apps/*"
  - "packages/*"

# Thống nhất một phiên bản ioredis duy nhất (tránh xung đột type giữa app và bullmq).
overrides:
  ioredis: "5.11.1"

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  core-js: false
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Cho phép chạy build script (native/postinstall) của các package tin cậy.
onlyBuiltDependencies:
  - argon2
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - msgpackr-extract
  - esbuild
  - "@nestjs/core"
  - sharp
  - unrs-resolver
